<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Famo 跨裝置資料更新流程</title>
<style>
  :root {
    color-scheme: light;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color: #172433;
    background: #edf2f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1240px; margin: auto; padding: clamp(18px, 4vw, 56px); }
  h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 42px); letter-spacing: -.025em; }
  p { margin: 0; line-height: 1.65; }
  header p, figcaption { color: #45586b; }
  figure { margin: 24px 0 0; }
  .diagram { overflow-x: auto; background: white; border: 1px solid #cbd7e2; border-radius: 16px; }
  .diagram:focus-visible { outline: 3px solid #1d63a0; outline-offset: 3px; }
  svg { display: block; width: 100%; min-width: 1040px; height: auto; }
  figcaption { margin-top: 12px; font-size: 14px; }
  svg text { fill: #172433; }
  .actor { font-size: 16px; font-weight: 700; }
  .detail { font-size: 12px; fill: #45586b; }
  .message { font-size: 14px; font-weight: 650; paint-order: stroke; stroke: white; stroke-width: 4; stroke-linejoin: round; }
  .phase { font-size: 13px; font-weight: 750; fill: #45586b; letter-spacing: .06em; }
  .life { stroke: #bdcad7; stroke-width: 1.3; stroke-dasharray: 5 6; }
  .http, .data, .ws, .local { fill: none; stroke-width: 2; }
  .http { stroke: #24639c; marker-end: url(#blue-arrow); }
  .data { stroke: #53677b; marker-end: url(#gray-arrow); }
  .ws { stroke: #7953a2; marker-end: url(#purple-arrow); }
  .local { stroke: #327660; marker-end: url(#green-arrow); }
  .return { stroke-dasharray: 5 4; }
  @media print {
    :root { background: white; }
    main { max-width: none; padding: 0; }
    .diagram { overflow: visible; }
    svg { min-width: 0; }
    figure { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Famo 跨裝置資料更新流程</h1>
    <p>以 Mac 修改任務、手機網頁收到更新為例。手機修改時，兩個 Client 交換角色。</p>
  </header>
  <figure>
    <div class="diagram" role="region" aria-label="同步流程圖，可水平捲動" tabindex="0">
      <svg viewBox="0 0 1140 784" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="diagram-title">從寫入 D1 到手機收到更新的時序圖</title>
        <desc id="diagram-desc">Mac 把修改存入本機 SQLite，經由 Cloudflare Access 呼叫 Worker。Worker 寫入 D1 後回覆 Mac，並呼叫同帳號的 Durable Object 透過 WebSocket 通知兩台裝置。手機收到通知後經由 Access 呼叫 Worker，從 D1 拉取游標之後的變更並更新畫面。</desc>
        <defs>
          <marker id="blue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24639c"/></marker>
          <marker id="gray-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53677b"/></marker>
          <marker id="purple-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7953a2"/></marker>
          <marker id="green-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#327660"/></marker>
        </defs>

        <g text-anchor="middle">
          <g fill="#e5f3ee" stroke="#9ac7b6">
            <rect x="18" y="28" width="160" height="62" rx="12"/>
            <rect x="206" y="28" width="160" height="62" rx="12"/>
          </g>
          <g fill="#e9f2fa" stroke="#a6c4df">
            <rect x="394" y="28" width="160" height="62" rx="12"/>
            <rect x="582" y="28" width="160" height="62" rx="12"/>
          </g>
          <rect x="770" y="28" width="160" height="62" rx="12" fill="#ecf0f5" stroke="#bdcad7"/>
          <rect x="958" y="28" width="164" height="62" rx="12" fill="#f1eaf9" stroke="#cbb7e0"/>
          <text class="actor" x="98" y="54">Client A · Mac</text>
          <text class="detail" x="98" y="74">本機 SQLite／待送佇列</text>
          <text class="actor" x="286" y="54">Client B · 手機網頁</text>
          <text class="detail" x="286" y="74">瀏覽器資料／同步游標</text>
          <text class="actor" x="474" y="54">Cloudflare Access</text>
          <text class="detail" x="474" y="74">登入及請求驗證</text>
          <text class="actor" x="662" y="54">Cloudflare Worker</text>
          <text class="detail" x="662" y="74">同步 API／帳號路由</text>
          <text class="actor" x="850" y="54">D1</text>
          <text class="detail" x="850" y="74">任務版本與變更紀錄</text>
          <text class="actor" x="1040" y="54">Durable Object</text>
          <text class="detail" x="1040" y="74">每個同步帳號一個</text>
        </g>

        <path class="life" d="M98 90V744 M286 90V744 M474 90V744 M662 90V744 M850 90V744 M1040 90V744"/>
        <rect x="18" y="100" width="1104" height="29" rx="7" fill="#f2f5f8"/>
        <text x="570" y="119" text-anchor="middle" class="detail">開始前，兩個 Client 都已通過 Access，並建立同一帳號的 WebSocket 連線。</text>

        <text class="phase" x="18" y="151">寫入與提交</text>
        <path class="local" d="M98 177H144V197H98"/>
        <text class="message" x="154" y="190">本機儲存並排入待送佇列</text>
        <path class="http" d="M98 233H474"/>
        <text class="message" x="286" y="224" text-anchor="middle">① POST /api/sync/push</text>
        <path class="http" d="M474 256H662"/>
        <text class="message" x="568" y="248" text-anchor="middle">驗證後放行</text>
        <path class="data" d="M662 289H850"/>
        <text class="message" x="756" y="280" text-anchor="middle">② 驗版本，寫入變更</text>
        <path class="data return" d="M850 323H662"/>
        <text class="message" x="756" y="314" text-anchor="middle">提交成功，回傳序號</text>

        <rect x="18" y="346" width="1104" height="28" rx="7" fill="#f3eef8"/>
        <text class="phase" x="29" y="365">D1 提交後，HTTP 回覆與背景廣播可各自完成</text>
        <path class="http return" d="M662 408H98"/>
        <text class="message" x="380" y="399" text-anchor="middle">③ HTTP 200，確認寫入已接受</text>
        <path class="data" d="M662 442H1040"/>
        <text class="message" x="851" y="433" text-anchor="middle">④ 呼叫帳號的 Durable Object 廣播</text>
        <path class="ws" d="M1040 478H286"/>
        <text class="message" x="663" y="469" text-anchor="middle">⑤ WebSocket 傳送變更類型及序號</text>
        <path class="ws" d="M1040 509H98"/>
        <text class="detail" x="562" y="500" text-anchor="middle">同帳號的 Mac 也會收到同一則通知</text>

        <text class="phase" x="18" y="551">接收端拉取資料</text>
        <path class="http" d="M286 582H474"/>
        <text class="message" x="380" y="573" text-anchor="middle">⑥ GET /api/sync/pull</text>
        <path class="http" d="M474 606H662"/>
        <text class="message" x="568" y="597" text-anchor="middle">驗證後放行</text>
        <path class="data" d="M662 634H850"/>
        <text class="message" x="756" y="625" text-anchor="middle">讀取游標之後的變更</text>
        <path class="data return" d="M850 662H662"/>
        <text class="message" x="756" y="653" text-anchor="middle">回傳變更與新游標</text>
        <path class="http return" d="M662 690H286"/>
        <text class="message" x="474" y="681" text-anchor="middle">⑦ HTTP 200，回傳實際任務資料</text>
        <path class="local" d="M286 716H332V737H286"/>
        <text class="message" x="342" y="732">套用變更，更新畫面和游標</text>

        <g class="detail">
          <path class="http" d="M25 764H53"/><text x="62" y="768">HTTP 請求／回覆</text>
          <path class="data" d="M220 764H248"/><text x="257" y="768">Cloudflare 內部呼叫</text>
          <path class="ws" d="M429 764H457"/><text x="466" y="768">WebSocket 通知</text>
          <path class="local" d="M609 764H637"/><text x="646" y="768">Client 本機操作</text>
        </g>
      </svg>
    </div>
    <figcaption>WebSocket 通知只帶類型和序號。接收端的 HTTP 請求會取得實際資料，也會計入 Worker invocations。若漏接通知，重連後可從最後已套用的游標補拉。Projects／Boards 則透過 <code>/api/sync/collections</code> 讀取最新集合。</figcaption>
  </figure>
</main>
</body>
</html>
